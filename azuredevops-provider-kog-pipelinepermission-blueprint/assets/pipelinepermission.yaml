externalDocs:
  description: Azure DevOps REST APIs
  url: https://aka.ms/azure-devops-rest-apis
servers:
- url: https://dev.azure.com/
security:
- accessToken: []
tags:
- name: Pipeline Permissions
paths:
  /api/{organization}/{project}/pipelines/pipelinepermissions/{resourceType}/{resourceId}:
    post:
      servers:
        - url: {{ include "pipelinepermission.webServiceUrl" . }}
          description: URL of the Azure DevOps RDC plugin
      summary: Calculate actual pipeline permissions by comparing desired state with Azure DevOps
      description: This endpoint accepts the desired pipeline permission state in the request body and returns the actual state by comparing with Azure DevOps API response. Pipelines in the desired state that are not authorized in Azure DevOps are marked as unauthorized in the response.
      operationId: post-pipelinepermission
      parameters:
        - name: organization
          in: path
          description: Organization name
          required: true
          schema:
            type: string
        - name: project
          in: path
          description: Project name
          required: true
          schema:
            type: string
        - name: resourceType
          in: path
          description: Resource type (e.g., environment, queue)
          required: true
          schema:
            type: string
            enum:
              - repository
              - environment
              - queue
              - teamproject
              - endpoint
              - variablegroup
              - securefile
        - name: resourceId
          in: path
          description: Resource ID
          required: true
          schema:
            type: string
        - name: api-version
          in: query
          description: API version (e.g., 7.2-preview.1)
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: Basic Auth header (Basic <base64-encoded-username:password>)
          required: true
          schema:
            type: string
      requestBody:
        description: Desired pipeline permission state
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pipelinepermission.ManagedPipelinesRequest'
        required: true
      responses:
        "200":
          description: Actual pipeline permission state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pipelinepermission.ResourcePipelinePermissions'
  /{organization}/{project}/_apis/pipelines/pipelinepermissions/{resourceType}/{resourceId}:
    patch:
      tags:
      - Pipeline Permissions
      description: Authorizes/Unauthorizes a list of definitions for a given resource.
      operationId: Pipeline Permissions_Update Pipeline Permisions For Resource
      parameters:
      - name: organization
        in: path
        description: The name of the Azure DevOps organization.
        required: true
        schema:
          type: string
      - name: project
        in: path
        description: Project ID or project name
        required: true
        schema:
          type: string
      - name: resourceType
        in: path
        required: true
        schema:
          type: string
          enum:
            - repository
            - environment
            - queue
            - teamproject
            - endpoint
            - variablegroup
            - securefile
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: Version of the API to use.  This should be set to '7.2-preview.1'
          to use this version of the api.
        required: true
        default: 7.2-preview.1
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestBody'
        required: true
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePipelinePermissions'
      #security:
      #- oauth2:
      #  - vso.pipelineresources_manage
      #x-ms-docs-override-version: 7.2-preview.1
      #x-ms-vss-resource: pipelinePermissions
      #x-ms-vss-method: UpdatePipelinePermisionsForResource
      #x-ms-preview: true
      #x-codegen-request-body-name: body
components:
  schemas:
    GraphSubjectBase:
      type: object
      properties:
        _links:
          $ref: '#/components/schemas/ReferenceLinks'
        descriptor:
          type: string
          description: The descriptor is the primary way to reference the graph subject
            while the system is running. This field will uniquely identify the same
            graph subject across both Accounts and Organizations.
        displayName:
          type: string
          description: "This is the non-unique display name of the graph subject.\
            \ To change this field, you must alter its value in the source provider."
        url:
          type: string
          description: This url is the full route to the source resource of this graph
            subject.
      description: ""
    IdentityRef:
      properties:
        directoryAlias:
          type: string
          description: Deprecated - Can be retrieved by querying the Graph user referenced
            in the "self" entry of the IdentityRef "_links" dictionary
        id:
          type: string
        imageUrl:
          type: string
          description: Deprecated - Available in the "avatar" entry of the IdentityRef
            "_links" dictionary
        inactive:
          type: boolean
          description: Deprecated - Can be retrieved by querying the Graph membership
            state referenced in the "membershipState" entry of the GraphUser "_links"
            dictionary
        isAadIdentity:
          type: boolean
          description: Deprecated - Can be inferred from the subject type of the descriptor
            (Descriptor.IsAadUserType/Descriptor.IsAadGroupType)
        isContainer:
          type: boolean
          description: Deprecated - Can be inferred from the subject type of the descriptor
            (Descriptor.IsGroupType)
        isDeletedInOrigin:
          type: boolean
        profileUrl:
          type: string
          description: Deprecated - not in use in most preexisting implementations
            of ToIdentityRef
        uniqueName:
          type: string
          description: Deprecated - use Domain+PrincipalName instead
      description: ""
      allOf:
      - $ref: '#/components/schemas/GraphSubjectBase'
    Permission:
      type: object
      properties:
        authorized:
          type: boolean
        authorizedBy:
          $ref: '#/components/schemas/IdentityRef'
        authorizedOn:
          type: string
          format: date-time
      description: ""
    PermissionNoAuthorizationDetails:
      type: object
      properties:
        authorized:
          type: boolean
      description: ""
    PipelinePermissionNoAuthorizationDetails:
      type: object
      properties:
        id:
          type: integer
          format: int32
        authorized:
          type: boolean
      description: ""
    PipelinePermission:
      properties:
        id:
          type: integer
          format: int32
      description: ""
      allOf:
      - $ref: '#/components/schemas/Permission'
    ReferenceLinks:
      type: object
      properties:
        links:
          type: object
          additionalProperties:
            type: object
            properties: {}
          description: "The readonly view of the links.  Because Reference links are\
            \ readonly, we only want to expose them as read only."
      description: The class to represent a collection of REST reference links.
    Resource:
      type: object
      properties:
        id:
          type: string
          description: Id of the resource.
        name:
          type: string
          description: Name of the resource.
        type:
          type: string
          description: Type of the resource.
      description: ""
    ResourcePipelinePermissions: # response body of the get and patch operations
      type: object
      properties:
        allPipelines:
          $ref: '#/components/schemas/Permission'
        pipelines:
          type: array
          items:
            $ref: '#/components/schemas/PipelinePermission'
        resource:
          $ref: '#/components/schemas/Resource'
      description: ""
    RequestBody:
      type: object
      properties:
        allPipelines:
          $ref: '#/components/schemas/PermissionNoAuthorizationDetails'
        pipelines:
          type: array
          items:
            $ref: '#/components/schemas/PipelinePermissionNoAuthorizationDetails'
      description: ""


    # Schema from plugin
    pipelinepermission.IdentityRef:
      type: object
      properties:
        _links:
          $ref: '#/components/schemas/pipelinepermission.ReferenceLinks'
        descriptor:
          type: string
        directoryAlias:
          type: string
        displayName:
          type: string
        id:
          type: string
        imageUrl:
          type: string
        inactive:
          type: boolean
        isAadIdentity:
          type: boolean
        isContainer:
          type: boolean
        isDeletedInOrigin:
          type: boolean
        profileUrl:
          type: string
        uniqueName:
          type: string
        url:
          type: string
    pipelinepermission.ManagedPipelinesRequest:
      type: object
      properties:
        allPipelines:
          $ref: '#/components/schemas/pipelinepermission.PermissionRequest'
        pipelines:
          type: array
          items:
            $ref: '#/components/schemas/pipelinepermission.PipelinePermissionRequest'
    pipelinepermission.Permission:
      type: object
      properties:
        authorized:
          type: boolean
        authorizedBy:
          $ref: '#/components/schemas/pipelinepermission.IdentityRef'
        authorizedOn:
          type: string
    pipelinepermission.PermissionRequest:
      type: object
      properties:
        authorized:
          type: boolean
    pipelinepermission.PipelinePermission:
      type: object
      properties:
        authorized:
          type: boolean
        authorizedBy:
          $ref: '#/components/schemas/pipelinepermission.IdentityRef'
        authorizedOn:
          type: string
        id:
          type: integer
    pipelinepermission.PipelinePermissionRequest:
      type: object
      properties:
        authorized:
          type: boolean
        id:
          type: integer
    pipelinepermission.ReferenceLinks:
      type: object
      properties:
        links:
          type: object
          additionalProperties: true
    pipelinepermission.Resource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
    pipelinepermission.ResourcePipelinePermissions:
      type: object
      properties:
        allPipelines:
          $ref: '#/components/schemas/pipelinepermission.Permission'
        pipelines:
          type: array
          items:
            $ref: '#/components/schemas/pipelinepermission.PipelinePermission'
        resource:
          $ref: '#/components/schemas/pipelinepermission.Resource'
