apiVersion: azuredevops.ogen.krateo.io/v1alpha1
kind: GraphGroupConfiguration
metadata:
  name: my-graphgroup-config
  namespace: default
spec:
  authentication:
    basic:
      usernameRef:                  # Any value can be used as username as official Azure DevOps OAS suggests (field not used), but the secret and key must be set.
        name: azuredevops-secret
        namespace: default
        key: token
      passwordRef:
        name: azuredevops-secret
        namespace: default
        key: token

  # Configuration parameters for different API actions
  configuration:
    query:
      create:
        api-version: "7.2-preview.1"
      delete:
        api-version: "7.2-preview.1"
      findby:
        api-version: "7.2-preview.1"
        # subjectTypes: "Microsoft.IdentityModel.Claims.ClaimsIdentity" # Optional: Filter by subject types
      get:
        api-version: "7.2-preview.1"
