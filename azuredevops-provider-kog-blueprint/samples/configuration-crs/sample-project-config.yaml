apiVersion: azuredevops.ogen.krateo.io/v1alpha1
kind: ProjectConfiguration
metadata:
  name: my-project-config
  namespace: default
spec:
  authentication:
    basic:
      usernameRef:                  # Any value can be used as username as official Azure DevOps OAS suggests (field not used), but the secret and key must be set.
        name: azuredevops-secret
        namespace: default
        key: token
      passwordRef:
        name: azuredevops-secret
        namespace: default
        key: token
  configuration:
    query:
      create:
        api-version: "7.2-preview.4"
      delete:
        api-version: "7.2-preview.4"
      findby:
        api-version: "7.2-preview.4"
        #$top: 10 # Optional: limit number of results
      get:
        api-version: "7.2-preview.4"
      update:
        api-version: "7.2-preview.4"

