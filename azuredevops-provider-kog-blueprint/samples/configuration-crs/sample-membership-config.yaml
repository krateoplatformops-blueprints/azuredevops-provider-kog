apiVersion: azuredevops.ogen.krateo.io/v1alpha1
kind: MembershipConfiguration
metadata:
  name: my-membership-config
  namespace: default
spec:
  authentication:
    basic:
      usernameRef:                  # Any value can be used as username as official Azure DevOps OAS suggests (field not used), but the secret and key must be set.
        name: azuredevops-secret
        namespace: default
        key: token
      passwordRef:
        name: azuredevops-secret
        namespace: default
        key: token

  # Configuration parameters for different API actions
  # Note: Membership has no findby or update actions
  configuration:
    query:
      create:
        api-version: "7.2-preview.1"
      delete:
        api-version: "7.2-preview.1"
      get:
        api-version: "7.2-preview.1"
