apiVersion: azuredevops.ogen.krateo.io/v1alpha1
kind: Membership
metadata:
  name: test-membership-user-to-team
  namespace: default
  annotations:
    krateo.io/connector-verbose: "true"
    krateo.io/deletion-policy: "orphan"
spec:
  # Reference to the configuration CR
  configurationRef:
    name: my-membership-config
    namespace: default

  # Azure DevOps organization name
  organization: krateo-kog

  # User descriptor (the member being added)
  # This is the descriptor of the user you want to add to the group
  # You can get user descriptors from the Graph API: GET /{organization}/_apis/graph/users
  # Example: Matteo Gastaldello's descriptor
  subjectDescriptor: aad.MTllODY4MjEtOGRhNC03ZmQzLTliMjgtMjQ1ZGQ5NzRjYzZk

  # Team descriptor (the container receiving the member)
  # This is the descriptor of the team you want to add the user to
  # [project-1-classic]\Team-KOG-00001
  containerDescriptor: vssgp.Uy0xLTktMTU1MTM3NDI0NS04Mjk0NTczMDUtMTMxMzc1NTk3NS0yNTg4Mzc0MDEyLTMzMDE2ODA5OTgtMS0yMTUzMTEwMDQwLTIwMzM5MTM0MTEtMjUyNzIzNzE4Ny03OTUxNjI5Nzg
