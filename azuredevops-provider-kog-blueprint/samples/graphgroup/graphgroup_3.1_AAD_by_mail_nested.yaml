apiVersion: azuredevops.ogen.krateo.io/v1alpha1
kind: GraphGroup
metadata:
  name: test-graphgroup-with-aad-mail-nested-00002
  namespace: default
  annotations:
    krateo.io/connector-verbose: "true"
spec:
  # Reference to the configuration CR
  configurationRef:
    name: my-graphgroup-config
    namespace: default

  # Azure DevOps organization name
  organization: krateo-kog

  # Materialize an AAD group using mail address
  # This references an existing group from Azure Active Directory
  mailAddress: "DevOpsGroup-10@krateo.io"

  # Add this new group as a member of multiple existing groups
  # This creates a nested group hierarchy
  # Format: comma-separated list of group descriptors
  # Example descriptors below (replace with actual descriptors from your organization)
  # test1 group
  groupDescriptors: "vssgp.Uy0xLTktMTU1MTM3NDI0NS0yMzgyNjQzNzU1LTExODE2NjQzMjMtMzEwNTYzNjM2Ni00MjA0NjczODI2LTEtNjU2MTUwMTQzLTM3NTk4OTk3MTItMjIxMjU1NjYyMi0yMzI3NjU1NTkz"
