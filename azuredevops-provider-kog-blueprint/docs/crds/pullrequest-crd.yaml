                      set the value of MergeStrategy. If MergeStrategy is set to any
                      value, the SquashMerge value will be ignored. If MergeStrategy
                      is not set, the merge strategy will be no-fast-forward if this
                      flag is false, or squash if true.
                    type: boolean
