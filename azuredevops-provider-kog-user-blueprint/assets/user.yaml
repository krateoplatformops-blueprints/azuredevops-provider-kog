components:
  schemas:
    AadGraphMember:
      properties:
        directoryAlias:
          type: string
          description: The short, generally unique name for the user in the backing directory. For AAD users, this corresponds
            to the mail nickname, which is often but not necessarily similar to the part of the user's mail address before
            the @ sign. For GitHub users, this corresponds to the GitHub user handle.
        isDeletedInOrigin:
          type: boolean
          description: When true, the group has been deleted in the identity provider
        metaType:
          type: string
          description: The meta type of the user in the origin, such as "member", "guest", etc. See UserMetaType for the set
            of possible values.
      description: ''
      allOf:
      - $ref: '#/components/schemas/GraphMember'
    GraphMember:
      properties:
        domain:
          type: string
          description: This represents the name of the container of origin for a graph member. (For MSA this is "Windows Live
            ID", for AD the name of the domain, for AAD the tenantID of the directory, for VSTS groups the ScopeId, etc)
        mailAddress:
          type: string
          description: The email address of record for a given graph member. This may be different than the principal name.
        principalName:
          type: string
          description: This is the PrincipalName of this graph member from the source provider. The source provider may change
            this field over time and it is not guaranteed to be immutable for the life of the graph member by VSTS.
      description: ''
      allOf:
      - $ref: '#/components/schemas/GraphSubject'
    GraphSubject:
      properties:
        legacyDescriptor:
          type: string
          description: '[Internal Use Only] The legacy descriptor is here in case you need to access old version IMS using
            identity descriptor.'
        origin:
          type: string
          description: The type of source provider for the origin identifier (ex:AD, AAD, MSA)
        originId:
          type: string
          description: The unique identifier from the system of origin. Typically a sid, object id or Guid. Linking and unlinking
            operations can cause this value to change for a user because the user is not backed by a different provider and
            has a different unique id in the new provider.
        subjectKind:
          type: string
          description: 'This field identifies the type of the graph subject (ex: Group, Scope, User).'
      description: Top-level graph entity
      allOf:
      - $ref: '#/components/schemas/GraphSubjectBase'
    GraphSubjectBase:
      type: object
      properties:
        _links:
          $ref: '#/components/schemas/ReferenceLinks'
        descriptor:
          type: string
          description: The descriptor is the primary way to reference the graph subject while the system is running. This
            field will uniquely identify the same graph subject across both Accounts and Organizations.
        displayName:
          type: string
          description: This is the non-unique display name of the graph subject. To change this field, you must alter its
            value in the source provider.
        url:
          type: string
          description: This url is the full route to the source resource of this graph subject.
      description: ''
    GraphUser:
      description: ''
      allOf:
      - $ref: '#/components/schemas/AadGraphMember'
    GraphUserCreationContext:
      type: object
      properties:
        storageKey:
          type: string
          description: 'Optional: If provided, we will use this identifier for the storage key of the created user'
          format: uuid
      description: Do not attempt to use this type to create a new user. Use one of the subclasses instead. This type does
        not contain sufficient fields to create a new user.
    GraphUserCreationContextUnified:
      type: object
      allOf:
      - $ref: '#/components/schemas/GraphUserMailAddressCreationContext'
      - $ref: '#/components/schemas/GraphUserOriginIdCreationContext'
      - $ref: '#/components/schemas/GraphUserPrincipalNameCreationContext'
      description: "Unified creation context supporting multiple user creation scenarios:\
        \ AAD/AD users via mail address (use mailAddress), via origin ID (use origin+originId),\
        \ or via principal name/UPN (use principalName). Provide the fields appropriate\
        \ for your use case."
    GraphUserMailAddressCreationContext:
      properties:
        mailAddress:
          type: string
          description: "This should be the mail address of the user in the source AD or AAD provider.\
            \ Example: Jamal.Hartnett@contoso.com Team Services will communicate with the\
            \ source provider to fill all other fields on creation."
      description: Use this type to create a new user using the mail address as a
        reference to an existing user from an external AD or AAD backed provider.
        This is the subset of GraphUser fields required for creation of a GraphUser
        for the AD and AAD use case when looking up the user by its mail address in
        the backing provider.
      allOf:
      - $ref: '#/components/schemas/GraphUserCreationContext'
    GraphUserOriginIdCreationContext:
      properties:
        origin:
          type: string
          description: "This should be the name of the origin provider. Example: github.com"
        originId:
          type: string
          description: "This should be the object id or sid of the user from the source\
            \ AD or AAD provider. Example: d47d025a-ce2f-4a79-8618-e8862ade30dd Team\
            \ Services will communicate with the source provider to fill all other\
            \ fields on creation."
      description: Use this type to create a new user using the OriginID as a reference
        to an existing user from an external AD or AAD backed provider. This is the
        subset of GraphUser fields required for creation of a GraphUser for the AD
        and AAD use case when looking up the user by its unique ID in the backing
        provider.
      allOf:
      - $ref: '#/components/schemas/GraphUserCreationContext'
    GraphUserPrincipalNameCreationContext:
      properties:
        principalName:
          type: string
          description: "This should be the principal name or upn of the user in the\
            \ source AD or AAD provider. Example: jamal@contoso.com Team Services\
            \ will communicate with the source provider to fill all other fields on\
            \ creation."
      description: Use this type to create a new user using the principal name as
        a reference to an existing user from an external AD or AAD backed provider.
        This is the subset of GraphUser fields required for creation of a GraphUser
        for the AD and AAD use case when looking up the user by its principal name
        in the backing provider.
      allOf:
      - $ref: '#/components/schemas/GraphUserCreationContext'
    ReferenceLinks:
      type: object
      properties:
        links:
          type: object
          additionalProperties:
            type: object
            properties: {}
          description: The readonly view of the links.  Because Reference links are readonly, we only want to expose them
            as read only.
      description: The class to represent a collection of REST reference links.
