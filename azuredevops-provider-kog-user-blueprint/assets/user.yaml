paths:
  /{organization}/_apis/graph/users:
    get:
      tags:
      - Users
      description: "Get a list of all users in a given scope.\n\nSince the list of users may be large, results are returned\
        \ in pages of users.  If there are more results\n than can be returned in a single page, the result set will contain\
        \ a continuation token for retrieval of the\n next set of results."
      operationId: Users_List
      parameters:
      - name: organization
        in: path
        description: The name of the Azure DevOps organization.
        required: true
        schema:
          type: string
      - name: subjectTypes
        in: query
        description: "A comma separated list of user subject subtypes to reduce the retrieved results, e.g. msa, aad, svc (service identity), imp (imported identity), etc."
        schema:
          type: string
      - name: continuationToken
        in: query
        description: An opaque data blob that allows the next page of data to resume immediately after where the previous
          page ended. The only reliable way to know if there is more data left is the presence of a continuation token.
        schema:
          type: string
      - name: scopeDescriptor
        in: query
        description: Specify a non-default scope (collection, project) to search for users.
        schema:
          type: string
      - name: api-version
        in: query
        description: Version of the API to use.  This should be set to '7.2-preview.1' to use this version of the api.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          headers:
            X-MS-ContinuationToken:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GraphUser'
      #security:
      #- oauth2:
      #  - vso.graph
      #x-ms-docs-override-version: 7.2-preview.1
      #x-ms-vss-resource: users
      #x-ms-vss-method: ListUsers
      #x-ms-preview: true
      #x-ms-examples:
      #  ? ''
      #  : $ref: ./httpExamples/Users/GetAllUsers.json
    post:
      tags:
      - Users
      description: "Materialize an existing AAD or MSA user into the ADO account.\n\nNOTE: Created users are not active in\
        \ an account unless they have been explicitly assigned a parent group at creation time or have signed in\n  and been\
        \ autolicensed through AAD group memberships.\n\n Adding a user to an account is required before the user can be added\
        \ to ADO groups or assigned an asset.\n\n The body of the request must be a derived type of GraphUserCreationContext:\n\
        \  * GraphUserMailAddressCreationContext - Create a new user using the mail address as a reference to an existing\
        \ user from an external AD or AAD backed provider.\n  * GraphUserOriginIdCreationContext - Create a new user using\
        \ the OriginID as a reference to an existing user from an external AD or AAD backed provider.\n  * GraphUserPrincipalNameCreationContext\
        \ - Create a new user using the principal name as a reference to an existing user from an external AD or AAD backed\
        \ provider.\n\n If the user to be added corresponds to a user that was previously deleted, then that user will be\
        \ restored.\n\n Optionally, you can add the newly created user as a member of an existing ADO group and/or specify\
        \ a custom storage key for the user."
      operationId: Users_Create
      parameters:
      - name: organization
        in: path
        description: The name of the Azure DevOps organization.
        required: true
        schema:
          type: string
      - name: groupDescriptors
        in: query
        description: A comma separated list of descriptors of groups you want the graph user to join
        schema:
          type: string
      - name: api-version
        in: query
        description: Version of the API to use.  This should be set to '7.2-preview.1' to use this version of the api.
        required: true
        schema:
          type: string
      requestBody:
        description: The subset of the full graph user used to uniquely find the graph subject in an external provider.
        content:
          application/json:
            schema:
              # $ref: '#/components/schemas/GraphUserCreationContext'  # Fixed: changed to unified schema
              $ref: '#/components/schemas/GraphUserCreationContextUnified'
        required: true
      responses:
        #'200':
        '201': # Fixed: changed response code from 200 to 201
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphUser'
      #security:
      #- oauth2:
      #  - vso.graph_manage
      #x-ms-docs-override-version: 7.2-preview.1
      #x-ms-vss-resource: users
      #x-ms-vss-method: CreateUser
      #x-ms-preview: true
      #x-ms-examples:
      #  Add an AAD user by UPN:
      #    $ref: ./httpExamples/Users/CreateUserAAD.json
      #  Add a MSA user by UPN:
      #    $ref: ./httpExamples/Users/CreateUserMSA.json
      #  Add an AAD user by OID:
      #    $ref: ./httpExamples/Users/MaterializeAADUserByOID.json
      #  Add an AAD user as member of a group:
      #    $ref: ./httpExamples/Users/MaterializeAADUserByOIDAsMember.json
      #  Add an AAD user with a custom storage key:
      #    $ref: ./httpExamples/Users/MaterializeAADUserByOIDWithStorageKey.json
      #x-codegen-request-body-name: body
  /{organization}/_apis/graph/users/{userDescriptor}:
    get:
      tags:
      - Users
      description: Get a user by its descriptor.
      operationId: Users_Get
      parameters:
      - name: organization
        in: path
        description: The name of the Azure DevOps organization.
        required: true
        schema:
          type: string
      - name: userDescriptor
        in: path
        description: The descriptor of the desired user.
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: Version of the API to use.  This should be set to '7.2-preview.1' to use this version of the api.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphUser'
      #security:
      #- oauth2:
      #  - vso.graph
      #x-ms-docs-override-version: 7.2-preview.1
      #x-ms-vss-resource: users
      #x-ms-vss-method: GetUser
      #x-ms-preview: true
      #x-ms-examples:
      #  ? ''
      #  : $ref: ./httpExamples/Users/GetUserAAD.json
    delete:
      tags:
      - Users
      description: 'Disables a user.


        The user will still be visible, but membership checks for the user will return false.'
      operationId: Users_Delete
      parameters:
      - name: organization
        in: path
        description: The name of the Azure DevOps organization.
        required: true
        schema:
          type: string
      - name: userDescriptor
        in: path
        description: The descriptor of the user to delete.
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: Version of the API to use.  This should be set to '7.2-preview.1' to use this version of the api.
        required: true
        schema:
          type: string
      responses:
        #'200':
        '204': # Fixed: changed response code from 200 to 204
          description: successful operation
          content: {}
      #security:
      #- oauth2:
      #  - vso.graph_manage
      #x-ms-docs-override-version: 7.2-preview.1
      #x-ms-vss-resource: users
      #x-ms-vss-method: DeleteUser
      #x-ms-preview: true
      #x-ms-examples:
      #  ? ''
      #  : $ref: ./httpExamples/Users/DeleteUserAAD.json
