host: localhost:8080
info:
  contact:
    email: contact@krateoplatformops.io
    name: Krateo Support
    url: https://krateo.io
  description: Simple wrapper around Azure DevOps API to provide consistency of API
    response for Krateo Operator Generator (KOG)
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Azure DevOps PullRequest Plugin API for Krateo Operator Generator (KOG)
  version: "1.0"
paths:
  /api/{organization}/{project}/git/repositories/{repositoryId}/pullrequests/{pullRequestId}:
    patch:
      consumes:
      - application/json
      description: Update an existing pull request.
      operationId: update-pullrequest
      parameters:
      - description: Organization name
        in: path
        name: organization
        required: true
        type: string
      - description: Project name or ID
        in: path
        name: project
        required: true
        type: string
      - description: Repository ID
        in: path
        name: repositoryId
        required: true
        type: string
      - description: Pull Request ID
        in: path
        name: pullRequestId
        required: true
        type: integer
      - description: API version (e.g., 7.2-preview.2)
        in: query
        name: api-version
        required: true
        type: string
      - description: Basic Auth header
        in: header
        name: Authorization
        required: true
        type: string
      - description: Pull request updates
        in: body
        name: pullRequest
        required: true
        schema:
          $ref: '#/definitions/pullrequest.UpdatePullRequestReq'
      produces:
      - application/json
      responses:
        "200":
          description: Updated pull request
          schema:
            $ref: '#/definitions/pullrequest.GitPullRequest'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Update a pull request
schemes:
- http
swagger: "2.0"
