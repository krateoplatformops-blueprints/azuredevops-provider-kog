openapi: 3.0.1
info:
  title: Azure DevOps Project Plugin API for Krateo Operator Generator (KOG)
  description: Simple wrapper around Azure DevOps API to transform operation references and handle async operations for project create/update/delete operations
  termsOfService: http://swagger.io/terms/
  contact:
    name: Krateo Support
    url: https://krateo.io
    email: contact@krateoplatformops.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: "1.0"
servers:
  - url: http://localhost:8080/
paths:
  /plugin/{organization}/projects:
    post:
      tags:
        - Projects
      summary: Create a project
      description: Create a new project in Azure DevOps. Returns a transformed operation reference.
      operationId: Projects_Create
      parameters:
        - name: organization
          in: path
          description: The name of the Azure DevOps organization.
          required: true
          schema:
            type: string
        - name: api-version
          in: query
          description: API version (e.g., 7.2-preview.4)
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: Basic Auth header
          required: true
          schema:
            type: string
      requestBody:
        description: The project to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/project.ProjectRequestBodyMerged'
        required: true
      responses:
        "202":
          description: Transformed operation reference with prefixed fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/project.TransformedOperationReference'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
      x-codegen-request-body-name: project
  /plugin/{organization}/projects/{projectId}:
    delete:
      tags:
        - Projects
      summary: Delete a project
      description: Delete an existing project in Azure DevOps. Polls the operation until complete and returns 204 No Content.
      operationId: Projects_Delete
      parameters:
        - name: organization
          in: path
          description: The name of the Azure DevOps organization.
          required: true
          schema:
            type: string
        - name: projectId
          in: path
          description: Project ID
          required: true
          schema:
            type: string
        - name: api-version
          in: query
          description: API version (e.g., 7.2-preview.4)
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: Basic Auth header
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content - project deleted successfully
          content: {}
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
    patch:
      tags:
        - Projects
      summary: Update a project
      description: Update an existing project in Azure DevOps. Polls the operation until complete and returns the updated project.
      operationId: Projects_Update
      parameters:
        - name: organization
          in: path
          description: The name of the Azure DevOps organization.
          required: true
          schema:
            type: string
        - name: projectId
          in: path
          description: Project ID
          required: true
          schema:
            type: string
        - name: api-version
          in: query
          description: API version (e.g., 7.2-preview.4)
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: Basic Auth header
          required: true
          schema:
            type: string
      requestBody:
        description: Project update request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/project.ProjectRequestBodyUpdate'
        required: true
      responses:
        "200":
          description: Updated project object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/project.ProjectResponseBody'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
      x-codegen-request-body-name: project
components:
  schemas:
    project.Capabilities:
      type: object
      properties:
        processTemplate:
          $ref: '#/components/schemas/project.ProcessTemplate'
        versioncontrol:
          $ref: '#/components/schemas/project.VersionControl'
    project.DefaultTeam:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
    project.Link:
      type: object
      properties:
        href:
          type: string
    project.ProcessTemplate:
      type: object
      properties:
        templateTypeId:
          type: string
    project.ProjectLinks:
      type: object
      properties:
        collection:
          $ref: '#/components/schemas/project.Link'
        self:
          $ref: '#/components/schemas/project.Link'
        web:
          $ref: '#/components/schemas/project.Link'
    project.ProjectRequestBodyMerged:
      type: object
      properties:
        abbreviation:
          type: string
          description: Only updatable field, not allowed in create
        capabilities:
          $ref: '#/components/schemas/project.Capabilities'
        description:
          type: string
        name:
          type: string
        visibility:
          type: string
          enum:
            - private
            - public
    project.ProjectRequestBodyUpdate:
      type: object
      properties:
        abbreviation:
          type: string
          description: Only updatable field, not allowed in create
        description:
          type: string
      description: Azure DevOps project object in request body for update
    project.ProjectResponseBody:
      type: object
      properties:
        _links:
          $ref: '#/components/schemas/project.ProjectLinks'
        abbreviation:
          type: string
        capabilities:
          $ref: '#/components/schemas/project.Capabilities'
        defaultTeam:
          $ref: '#/components/schemas/project.DefaultTeam'
        defaultTeamImageUrl:
          type: string
        description:
          type: string
        id:
          type: string
        lastUpdateTime:
          type: string
        name:
          type: string
        revision:
          type: integer
        state:
          type: string
          enum:
            - deleting
            - new
            - wellFormed
            - createPending
            - all
            - unchanged
            - deleted
        url:
          type: string
        visibility:
          type: string
          enum:
            - private
            - public
      description: Azure DevOps project object in response body
    project.TransformedOperationReference:
      type: object
      properties:
        operationId:
          type: string
        operationPluginId:
          type: string
        operationStatus:
          type: string
        operationUrl:
          type: string
    project.VersionControl:
      type: object
      properties:
        sourceControlType:
          type: string
x-original-swagger-version: "2.0"
