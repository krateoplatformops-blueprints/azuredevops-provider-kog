basePath: /
definitions:
  pipelinepermission.IdentityRef:
    properties:
      _links:
        $ref: '#/definitions/pipelinepermission.ReferenceLinks'
      descriptor:
        type: string
      directoryAlias:
        type: string
      displayName:
        type: string
      id:
        type: string
      imageUrl:
        type: string
      inactive:
        type: boolean
      isAadIdentity:
        type: boolean
      isContainer:
        type: boolean
      isDeletedInOrigin:
        type: boolean
      profileUrl:
        type: string
      uniqueName:
        type: string
      url:
        type: string
    type: object
  pipelinepermission.ManagedPipelinesRequest:
    properties:
      allPipelines:
        $ref: '#/definitions/pipelinepermission.PermissionRequest'
      pipelines:
        items:
          $ref: '#/definitions/pipelinepermission.PipelinePermissionRequest'
        type: array
    type: object
  pipelinepermission.Permission:
    properties:
      authorized:
        type: boolean
      authorizedBy:
        $ref: '#/definitions/pipelinepermission.IdentityRef'
      authorizedOn:
        type: string
    type: object
  pipelinepermission.PermissionRequest:
    properties:
      authorized:
        type: boolean
    type: object
  pipelinepermission.PipelinePermission:
    properties:
      authorized:
        type: boolean
      authorizedBy:
        $ref: '#/definitions/pipelinepermission.IdentityRef'
      authorizedOn:
        type: string
      id:
        type: integer
    type: object
  pipelinepermission.PipelinePermissionRequest:
    properties:
      authorized:
        type: boolean
      id:
        type: integer
    type: object
  pipelinepermission.ReferenceLinks:
    properties:
      links:
        additionalProperties: true
        type: object
    type: object
  pipelinepermission.Resource:
    properties:
      id:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  pipelinepermission.ResourcePipelinePermissions:
    properties:
      allPipelines:
        $ref: '#/definitions/pipelinepermission.Permission'
      pipelines:
        items:
          $ref: '#/definitions/pipelinepermission.PipelinePermission'
        type: array
      resource:
        $ref: '#/definitions/pipelinepermission.Resource'
    type: object
host: localhost:8080
info:
  contact:
    email: contact@krateoplatformops.io
    name: Krateo Support
    url: https://krateo.io
  description: Simple wrapper around Azure DevOps API to provide consistency of API
    response for Krateo Operator Generator (KOG)
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Azure DevOps PipelinePermission Plugin API for Krateo Operator Generator
    (KOG)
  version: "1.0"
paths:
  /api/{organization}/{project}/pipelines/pipelinepermissions/{resourceType}/{resourceId}:
    get:
      description: Get
      operationId: get-pipelinepermission
      parameters:
      - description: Organization name
        in: path
        name: organization
        required: true
        type: string
      - description: Project name
        in: path
        name: project
        required: true
        type: string
      - description: Resource type (e.g., pipelines, repositories)
        in: path
        name: resourceType
        required: true
        type: string
      - description: Resource ID (e.g., pipeline ID, repository ID)
        in: path
        name: resourceId
        required: true
        type: string
      - description: API version (e.g., 7.2-preview.1)
        in: query
        name: api-version
        required: true
        type: string
      - description: Basic Auth header (Basic <base64-encoded-username:password>)
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Pipeline permission details
          schema:
            $ref: '#/definitions/pipelinepermission.ResourcePipelinePermissions'
      summary: Get the pipeline permission of a resource
    post:
      consumes:
      - application/json
      description: This endpoint accepts the desired pipeline permission state in
        the request body and returns the actual state by comparing with Azure DevOps
        API response. Pipelines in the desired state that are not authorized in Azure
        DevOps are marked as unauthorized in the response.
      operationId: post-pipelinepermission
      parameters:
      - description: Organization name
        in: path
        name: organization
        required: true
        type: string
      - description: Project name
        in: path
        name: project
        required: true
        type: string
      - description: Resource type (e.g., environment, queue)
        in: path
        name: resourceType
        required: true
        type: string
      - description: Resource ID
        in: path
        name: resourceId
        required: true
        type: string
      - description: API version (e.g., 7.2-preview.1)
        in: query
        name: api-version
        required: true
        type: string
      - description: Basic Auth header (Basic <base64-encoded-username:password>)
        in: header
        name: Authorization
        required: true
        type: string
      - description: Desired pipeline permission state
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pipelinepermission.ManagedPipelinesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Actual pipeline permission state
          schema:
            $ref: '#/definitions/pipelinepermission.ResourcePipelinePermissions'
      summary: Calculate actual pipeline permissions by comparing desired state with
        Azure DevOps
schemes:
- http
swagger: "2.0"
