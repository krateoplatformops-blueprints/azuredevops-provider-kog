basePath: /
definitions:
  graphgroup.GraphGroup:
    properties:
      _links:
        additionalProperties: true
        type: object
      description:
        type: string
      descriptor:
        type: string
      displayName:
        type: string
      domain:
        type: string
      isCrossProject:
        type: boolean
      mailAddress:
        type: string
      origin:
        type: string
      originId:
        type: string
      principalName:
        type: string
      subjectKind:
        type: string
      url:
        type: string
    type: object
  graphgroup.GraphGroupsResponse:
    properties:
      count:
        description: Count after filtering (equals originalCount if no filtering)
        type: integer
      numberOfFilteredOut:
        description: Number of groups filtered out (0 if no filtering)
        type: integer
      originalCount:
        description: Original count from Azure DevOps API
        type: integer
      value:
        description: Array of graph groups
        items:
          $ref: '#/definitions/graphgroup.GraphGroup'
        type: array
    type: object
host: localhost:8080
info:
  contact:
    email: contact@krateoplatformops.io
    name: Krateo Support
    url: https://krateo.io
  description: Proxy wrapper around Azure DevOps Graph Groups API that filters organization-level
    groups when scopeDescriptor is not provided
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Azure DevOps GraphGroup Plugin API for Krateo Operator Generator (KOG)
  version: "1.0"
paths:
  /plugin/{organization}/graph/groups:
    get:
      description: Retrieve graph groups from Azure DevOps. When scopeDescriptor is
        not provided, filters out project-level groups to return only organization-level
        groups.
      operationId: get-graphgroups
      parameters:
      - description: Organization name
        in: path
        name: organization
        required: true
        type: string
      - description: Scope descriptor (e.g., project descriptor). When provided, returns
          all groups within that scope without filtering.
        in: query
        name: scopeDescriptor
        type: string
      - description: Comma-separated list of subject types to filter by
        in: query
        name: subjectTypes
        type: string
      - description: Continuation token for pagination
        in: query
        name: continuationToken
        type: string
      - description: API version (e.g., 7.2-preview.1)
        in: query
        name: api-version
        required: true
        type: string
      - description: Basic Auth header
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Retrieved graph groups with filtering metadata
          headers:
            X-MS-ContinuationToken:
              description: Continuation token for pagination (if more results available)
              type: string
          schema:
            $ref: '#/definitions/graphgroup.GraphGroupsResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get graph groups with optional filtering
      tags:
      - Graph Groups
schemes:
- http
swagger: "2.0"
