basePath: /
definitions:
  pipeline.BuildRepository:
    properties:
      id:
        description: Required
        type: string
      type:
        description: 'Required - enum: unknown, gitHub, azureReposGit, azureReposGitHyphenated'
        type: string
    type: object
  pipeline.GetPipelineResponse:
    properties:
      _links:
        $ref: '#/definitions/pipeline.ReferenceLinks'
      configuration:
        $ref: '#/definitions/pipeline.PipelineConfiguration'
      folder:
        description: Embedded fields from PipelineBase
        type: string
      id:
        type: integer
      name:
        type: string
      revision:
        type: integer
      url:
        type: string
    type: object
  pipeline.PipelineConfiguration:
    properties:
      path:
        type: string
      repository:
        allOf:
        - $ref: '#/definitions/pipeline.BuildRepository'
        description: Required
      type:
        description: 'enum: unknown, yaml, designerJson, justInTime, designerHyphenJson'
        type: string
    type: object
  pipeline.PipelineConfigurationParameters:
    properties:
      path:
        type: string
      repository:
        allOf:
        - $ref: '#/definitions/pipeline.BuildRepository'
        description: Required
      type:
        description: 'Required - enum: unknown, yaml, designerJson, justInTime, designerHyphenJson'
        type: string
    type: object
  pipeline.ReferenceLinks:
    properties:
      links:
        additionalProperties: true
        type: object
    type: object
  pipeline.UpdatePipelineRequest:
    properties:
      configuration:
        $ref: '#/definitions/pipeline.PipelineConfigurationParameters'
      folder:
        type: string
      id:
        description: maybe to be removed since RDC does not include it
        type: integer
      name:
        type: string
      revision:
        type: integer
    type: object
  pipeline.UpdatePipelineResponse:
    properties:
      _links:
        $ref: '#/definitions/pipeline.ReferenceLinks'
      configuration:
        $ref: '#/definitions/pipeline.PipelineConfiguration'
      folder:
        description: Embedded fields from PipelineBase
        type: string
      id:
        type: integer
      name:
        type: string
      revision:
        type: integer
      url:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: contact@krateoplatformops.io
    name: Krateo Support
    url: https://krateo.io
  description: Simple wrapper around Azure DevOps API to provide consisentency of
    API response for Krateo Operator Generator (KOG)
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Azure DevOps Pipeline Plugin API for Krateo Operator Generator (KOG)
  version: "1.0"
paths:
  /api/{organization}/{project}/pipelines/{id}:
    delete:
      description: Delete a pipeline using build definitions endpoint
      operationId: delete-pipeline
      parameters:
      - description: Organization name
        in: path
        name: organization
        required: true
        type: string
      - description: Project name or ID
        in: path
        name: project
        required: true
        type: string
      - description: Pipeline ID
        in: path
        name: id
        required: true
        type: string
      - description: Basic Auth header (Basic <base64-encoded-username:password>)
        in: header
        name: Authorization
        required: true
        type: string
      responses:
        "204":
          description: No Content - Pipeline deleted successfully
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Delete a pipeline
    get:
      description: Get
      operationId: get-pipeline
      parameters:
      - description: Organization name
        in: path
        name: organization
        required: true
        type: string
      - description: Project name or ID
        in: path
        name: project
        required: true
        type: string
      - description: Pipeline ID
        in: path
        name: id
        required: true
        type: string
      - description: API version (e.g., 7.2-preview.1)
        in: query
        name: api-version
        required: true
        type: string
      - description: Basic Auth header (Basic <base64-encoded-username:password>)
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Pipeline details
          schema:
            $ref: '#/definitions/pipeline.GetPipelineResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      summary: Get a pipeline
    put:
      consumes:
      - application/json
      description: Update a pipeline using build definitions endpoint
      operationId: put-pipeline
      parameters:
      - description: Organization name
        in: path
        name: organization
        required: true
        type: string
      - description: Project name or ID
        in: path
        name: project
        required: true
        type: string
      - description: Pipeline ID
        in: path
        name: id
        required: true
        type: string
      - description: Basic Auth header (Basic <base64-encoded-username:password>)
        in: header
        name: Authorization
        required: true
        type: string
      - description: Pipeline update request body
        in: body
        name: pipelineUpdate
        required: true
        schema:
          $ref: '#/definitions/pipeline.UpdatePipelineRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated pipeline details
          schema:
            $ref: '#/definitions/pipeline.UpdatePipelineResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Update a pipeline
schemes:
- http
swagger: "2.0"
