      #security:
      #- oauth2:
      #  - vso.graph
      #x-ms-docs-override-version: 7.2-preview.1
      #x-ms-vss-resource: groups
      #x-ms-vss-method: ListGroups
      #x-ms-preview: true
      #x-ms-examples:
      #  ? ''
      #  : $ref: ./httpExamples/Groups/GetAllGroups.json
    post:
      tags:
      - Groups
      description: "Create a new Azure DevOps group or materialize an existing AAD group.\n\nThe body of the request must\
        \ be a derived type of GraphGroupCreationContext:\n  * GraphGroupVstsCreationContext - Create a new Azure DevOps group\
        \ that is not backed by an external provider.\n  * GraphGroupMailAddressCreationContext - Create a new group using\
        \ the mail address as a reference to an existing group from an external AD or AAD backed provider.\n  * GraphGroupOriginIdCreationContext\
        \ - Create a new group using the OriginID as a reference to a group from an external AD or AAD backed provider.\n\n\
        \ Optionally, you can add the newly created group as a member of an existing Azure DevOps group and/or specify a custom\
        \ storage key for the group."
      operationId: Groups_Create
      parameters:
      - name: organization
        in: path
        description: The name of the Azure DevOps organization.
        required: true
        schema:
          type: string
      - name: scopeDescriptor
        in: query
        description: A descriptor referencing the scope (collection, project) in which the group should be created. If omitted,
          will be created in the scope of the enclosing account or organization. Valid only for VSTS groups.
        schema:
          type: string
      - name: groupDescriptors
        in: query
        description: A comma separated list of descriptors referencing groups you want the graph group to join
        schema:
          type: string
          format: array (string)
      - name: api-version
        in: query
        description: Version of the API to use.  This should be set to '7.2-preview.1' to use this version of the api.
        required: true
        schema:
          type: string
      requestBody:
        description: The subset of the full graph group used to uniquely find the graph subject in an external provider.
        content:
          application/json:
            schema:
              # $ref: '#/components/schemas/GraphGroupCreationContext'  # Fixed: changed to unified schema
              $ref: '#/components/schemas/GraphGroupCreationContextUnified'
        required: true
      responses:
        #'200':
        '201': # Fixed: changed response code from 200 to 201
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphGroup'
      #security:
      #- oauth2:
      #  - vso.graph_manage
      #x-ms-docs-override-version: 7.2-preview.1
      #x-ms-vss-resource: groups
      #x-ms-vss-method: CreateGroup
      #x-ms-preview: true
      #x-ms-examples:
      #  Create a Group at the account level:
      #    $ref: ./httpExamples/Groups/CreateGroup.json
      #  Create a Group at the project level:
      #    $ref: ./httpExamples/Groups/CreateGroupInProject.json
      #  Add an AAD Group by OID:
      #    $ref: ./httpExamples/Groups/MaterializeAADGroupByOID.json
      #  Add an AAD Group as member of a group:
      #    $ref: ./httpExamples/Groups/MaterializeAADGroupByOIDAsMember.json
      #  Add an AAD Group with a custom storage key:
      #    $ref: ./httpExamples/Groups/MaterializeAADGroupByOIDWithStorageKey.json
      #x-codegen-request-body-name: body
  /{organization}/_apis/graph/groups/{groupDescriptor}:
    get:
      tags:
      - Groups
      description: 'Get a group by its descriptor.


        The group will be returned even if it has been deleted from the account or has had all its memberships

        deleted.'
      operationId: Groups_Get
      parameters:
      - name: organization
        in: path
        description: The name of the Azure DevOps organization.
        required: true
        schema:
          type: string
      - name: groupDescriptor
        in: path
        description: The descriptor of the desired graph group.
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: Version of the API to use.  This should be set to '7.2-preview.1' to use this version of the api.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphGroup'
      #security:
      #- oauth2:
      #  - vso.graph
      #x-ms-docs-override-version: 7.2-preview.1
      #x-ms-vss-resource: groups
      #x-ms-vss-method: GetGroup
      #x-ms-preview: true
      #x-ms-examples:
      #  ? ''
      #  : $ref: ./httpExamples/Groups/GetGroup-AddRemoveAADGroupByOID.json
    delete:
      tags:
      - Groups
      description: "Removes an Azure DevOps group from all of its parent groups.\n\nThe group will still be visible, but membership\n\
        \ checks for the group, and all descendants which derive membership through it, will return false.\u201D"
      operationId: Groups_Delete
      parameters:
      - name: organization
        in: path
        description: The name of the Azure DevOps organization.
        required: true
        schema:
          type: string
      - name: groupDescriptor
        in: path
        description: The descriptor of the group to delete.
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: Version of the API to use.  This should be set to '7.2-preview.1' to use this version of the api.
        required: true
        schema:
          type: string
      responses:
        #'200':
        '204': # Fixed: changed response code from 200 to 204
          description: successful operation
          content: {}
      #security:
      #- oauth2:
      #  - vso.graph_manage
      #x-ms-docs-override-version: 7.2-preview.1
      #x-ms-vss-resource: groups
      #x-ms-vss-method: DeleteGroup
      #x-ms-preview: true
      #x-ms-examples:
      #  ? ''
      #  : $ref: ./httpExamples/Groups/DeleteGroup.json
    # PATCH endpoint commented out - JsonPatchDocument format not supported by OASGen Provider
    # Update functionality would require a plugin/middleware to convert standard updates to JSON Patch format
    # patch:
    #   tags:
    #   - Groups
