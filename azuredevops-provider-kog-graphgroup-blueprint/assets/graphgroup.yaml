    #         application/json:
    #           schema:
    #             $ref: '#/components/schemas/GraphGroup'
    #   security:
    #   - oauth2:
    #     - vso.graph_manage
    #   x-ms-docs-override-version: 7.2-preview.1
    #   x-ms-vss-resource: groups
    #   x-ms-vss-method: UpdateGroup
    #   x-ms-preview: true
    #   x-ms-examples:
    #     ? ''
    #     : $ref: ./httpExamples/Groups/UpdateGroup.json
    #   x-codegen-request-body-name: body
  /plugin/{organization}/graph/groups:
    get:
      servers:
        - url: {{ include "graphgroup.webServiceUrl" . }}
          description: URL of the Azure DevOps RDC plugin
      tags:
        - Graph Groups
      summary: Get graph groups with optional filtering
      description: Retrieve graph groups from Azure DevOps. When scopeDescriptor is not provided, filters out project-level groups to return only organization-level groups.
      operationId: get-graphgroups
      parameters:
        - name: organization
          in: path
          description: Organization name
          required: true
          schema:
            type: string
        - name: scopeDescriptor
          in: query
          description: Scope descriptor (e.g., project descriptor). When provided, returns all groups within that scope without filtering.
          schema:
            type: string
        - name: subjectTypes
          in: query
          description: Comma-separated list of subject types to filter by
          schema:
            type: string
        - name: continuationToken
          in: query
          description: Continuation token for pagination
          schema:
            type: string
        - name: api-version
          in: query
          description: API version (e.g., 7.2-preview.1)
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: Basic Auth header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Retrieved graph groups with filtering metadata
          headers:
            X-MS-ContinuationToken:
              description: Continuation token for pagination (if more results available)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/graphgroup.GraphGroupsResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
components:
  schemas:
    GraphGroup:
      properties:
        description:
          type: string
          description: A short phrase to help human readers disambiguate groups with similar names
      description: Graph group entity
      allOf:
      - $ref: '#/components/schemas/GraphMember'
    GraphGroupCreationContextUnified:
      type: object
      allOf:
      - $ref: '#/components/schemas/GraphGroupVstsCreationContext'
      - $ref: '#/components/schemas/GraphGroupMailAddressCreationContext'
      - $ref: '#/components/schemas/GraphGroupOriginIdCreationContext'
      description: "Unified creation context supporting multiple group creation scenarios:\
        \ VSTS native groups (use displayName/description), AAD groups via mail address\
        \ (use mailAddress), or AAD groups via origin ID (use originId). Provide the fields\
        \ appropriate for your use case."
    GraphGroupCreationContext:
      type: object
      properties:
        storageKey:
          type: string
          description: "Optional: If provided, we will use this identifier for the\
            \ storage key of the created group"
          format: uuid
      description: Do not attempt to use this type to create a new group. This type
        does not contain sufficient fields to create a new group.
    GraphGroupMailAddressCreationContext:
      properties:
        mailAddress:
          type: string
          description: "This should be the mail address or the group in the source\
            \ AD or AAD provider. Example: jamal@contoso.com Team Services will communicate\
            \ with the source provider to fill all other fields on creation."
      description: Use this type to create a new group using the mail address as a
        reference to an existing group from an external AD or AAD backed provider.
        This is the subset of GraphGroup fields required for creation of a group for
        the AAD and AD use case.
      allOf:
      - $ref: '#/components/schemas/GraphGroupCreationContext'
    GraphGroupOriginIdCreationContext:
      properties:
        originId:
          type: string
          description: "This should be the object id or sid of the group from the\
            \ source AD or AAD provider. Example: d47d025a-ce2f-4a79-8618-e8862ade30dd\
            \ Team Services will communicate with the source provider to fill all\
            \ other fields on creation."
      description: Use this type to create a new group using the OriginID as a reference
        to an existing group from an external AD or AAD backed provider. This is the
        subset of GraphGroup fields required for creation of a group for the AD and
        AAD use case.
      allOf:
      - $ref: '#/components/schemas/GraphGroupCreationContext'
    GraphGroupVstsCreationContext:
      properties:
        crossProject:
          type: boolean
          description: For internal use only in back compat scenarios.
        description:
          type: string
          description: "Used by VSTS groups; if set this will be the group description,\
            \ otherwise ignored"
        descriptor:
          type: string
        displayName:
          type: string
          description: "Used by VSTS groups; if set this will be the group DisplayName,\
            \ otherwise ignored"
        restrictedVisibility:
          type: boolean
          description: For internal use only in back compat scenarios.
        specialGroupType:
          type: string
          description: For internal use only in back compat scenarios.
      description: Use this type to create a new Vsts group that is not backed by
        an external provider.
      allOf:
      - $ref: '#/components/schemas/GraphGroupCreationContext'
    GraphMember:
      properties:
        domain:
          type: string
          description: This represents the name of the container of origin for a graph member. (For MSA this is "Windows Live
            ID", for AD the name of the domain, for AAD the tenantID of the directory, for VSTS groups the ScopeId, etc)
        mailAddress:
          type: string
          description: The email address of record for a given graph member. This may be different than the principal name.
        principalName:
          type: string
          description: This is the PrincipalName of this graph member from the source provider. The source provider may change
            this field over time and it is not guaranteed to be immutable for the life of the graph member by VSTS.
      description: ''
      allOf:
      - $ref: '#/components/schemas/GraphSubject'
    GraphSubject:
      properties:
        legacyDescriptor:
          type: string
          description: '[Internal Use Only] The legacy descriptor is here in case you need to access old version IMS using
            identity descriptor.'
        origin:
          type: string
          description: The type of source provider for the origin identifier (ex:AD, AAD, MSA)
        originId:
          type: string
          description: The unique identifier from the system of origin. Typically a sid, object id or Guid. Linking and unlinking
            operations can cause this value to change for a user because the user is not backed by a different provider and
            has a different unique id in the new provider.
        subjectKind:
          type: string
          description: 'This field identifies the type of the graph subject (ex: Group, Scope, User).'
      description: Top-level graph entity
      allOf:
      - $ref: '#/components/schemas/GraphSubjectBase'
    GraphSubjectBase:
      type: object
      properties:
        _links:
          $ref: '#/components/schemas/ReferenceLinks'
        descriptor:
          type: string
          description: The descriptor is the primary way to reference the graph subject while the system is running. This
            field will uniquely identify the same graph subject across both Accounts and Organizations.
        displayName:
          type: string
          description: This is the non-unique display name of the graph subject. To change this field, you must alter its
            value in the source provider.
        url:
          type: string
          description: This url is the full route to the source resource of this graph subject.
      description: ''
    JsonPatchDocument:
      description: The JSON model for JSON Patch Operations
      allOf:
      - type: array
        items:
          $ref: '#/components/schemas/JsonPatchOperation'
    JsonPatchOperation:
      type: object
      properties:
        from:
          type: string
          description: The path to copy from for the Move/Copy operation.
        op:
          type: string
          description: The patch operation
          enum:
          - add
          - remove
          - replace
          - move
          - copy
          - test
          x-ms-enum:
            name: Operation
            values:
            - value: add
              description: ''
            - value: remove
              description: ''
            - value: replace
              description: ''
            - value: move
              description: ''
            - value: copy
              description: ''
            - value: test
              description: ''
        path:
          type: string
          description: The path for the operation. In the case of an array, a zero based index can be used to specify the
            position in the array (e.g. /biscuits/0/name). The "-" character can be used instead of an index to insert at
            the end of the array (e.g. /biscuits/-).
        value:
          type: object
          properties: {}
          description: The value for the operation. This is either a primitive or a JToken.
      description: The JSON model for a JSON Patch operation
    ReferenceLinks:
      type: object
      properties:
        links:
          type: object
          additionalProperties:
            type: object
            properties: {}
          description: The readonly view of the links.  Because Reference links are readonly, we only want to expose them
            as read only.
      description: The class to represent a collection of REST reference links.
    # Additional Schemas for Plugin Endpoint
    graphgroup.GraphGroup:
      type: object
      properties:
        _links:
          type: object
          additionalProperties: true
        description:
          type: string
        descriptor:
          type: string
        displayName:
          type: string
        domain:
          type: string
        isCrossProject:
          type: boolean
        mailAddress:
          type: string
        origin:
          type: string
        originId:
          type: string
        principalName:
          type: string
        subjectKind:
          type: string
        url:
          type: string
    graphgroup.GraphGroupsResponse:
      type: object
      properties:
        count:
          type: integer
          description: Count after filtering (equals originalCount if no filtering)
        numberOfFilteredOut:
          type: integer
          description: Number of groups filtered out (0 if no filtering)
        originalCount:
          type: integer
          description: Original count from Azure DevOps API
        value:
          type: array
          description: Array of graph groups
          items:
            $ref: '#/components/schemas/graphgroup.GraphGroup'
