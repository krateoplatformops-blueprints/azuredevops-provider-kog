      security:
      - oauth2:
        - vso.graph
      x-ms-docs-override-version: 7.2-preview.1
      x-ms-vss-resource: requestAccess
      x-ms-vss-method: RequestAccess
      x-ms-preview: true
      x-codegen-request-body-name: body
  /{organization}/_apis/graph/serviceprincipals:
    get:
      tags:
      - Service Principals
      description: |-
        Get a list of all service principals in a given scope.

        Since the list of service principals may be large, results are returned in pages of service principals. If there are more results
         than can be returned in a single page, the result set will contain a continuation token for retrieval of the
         next set of results. The only reliable way to know if there is no more service principals left is the lack of a continuation token.
      operationId: Service Principals_List
      parameters:
      - name: organization
        in: path
        description: The name of the Azure DevOps organization.
        required: true
        schema:
          type: string
      - name: continuationToken
        in: query
        description: An opaque data blob that allows the next page of data to resume
          immediately after where the previous page ended. The only reliable way to
          know if there is more data left is the presence of a continuation token.
        schema:
          type: string
      - name: scopeDescriptor
        in: query
        description: "Specify a non-default scope (collection, project) to search\
          \ for service principals."
        schema:
          type: string
      - name: api-version
        in: query
        description: Version of the API to use.  This should be set to '7.2-preview.1'
          to use this version of the api.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: successful operation
          headers:
            X-MS-ContinuationToken:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GraphServicePrincipal'
      security:
      - oauth2:
        - vso.graph
      x-ms-docs-override-version: 7.2-preview.1
      x-ms-vss-resource: servicePrincipals
      x-ms-vss-method: ListServicePrincipals
      x-ms-preview: true
      x-ms-examples:
        ? ""
        : $ref: ./httpExamples/ServicePrincipals/GetAllServicePrincipals.json
    post:
      tags:
      - Service Principals
      description: |-
        Materialize an existing AAD service principal into the ADO account.

        NOTE: Created service principals are not active in an account.

         Adding a service principal to an account is required before the service principal can be added to ADO groups or assigned an asset.

         The body of the request must be a derived type of GraphServicePrincipalCreationContext:
          * GraphServicePrincipalOriginIdCreationContext - Create a new service principal using the OriginID as a reference to an existing service principal from AAD backed provider.

         If the service principal to be added corresponds to a service principal that was previously deleted, then that service principal will be restored.

         Optionally, you can add the newly created service principal as a member of an existing ADO group and/or specify a custom storage key for the service principal.
      operationId: Service Principals_Create
      parameters:
      - name: organization
        in: path
        description: The name of the Azure DevOps organization.
        required: true
        schema:
          type: string
      - name: groupDescriptors
        in: query
        description: A comma separated list of descriptors of groups you want the
          graph service principal to join
        schema:
          type: string
          format: array (string)
      - name: api-version
        in: query
        description: Version of the API to use.  This should be set to '7.2-preview.1'
          to use this version of the api.
        required: true
        schema:
          type: string
      requestBody:
        description: The subset of the full graph service principal used to uniquely
          find the graph subject in an external provider.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphServicePrincipalCreationContext'
        required: true
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphServicePrincipal'
      security:
      - oauth2:
        - vso.graph_manage
      x-ms-docs-override-version: 7.2-preview.1
      x-ms-vss-resource: servicePrincipals
      x-ms-vss-method: CreateServicePrincipal
      x-ms-preview: true
      x-ms-examples:
        ? ""
        : $ref: ./httpExamples/ServicePrincipals/CreateServicePrincipal.json
      x-codegen-request-body-name: body
  /{organization}/_apis/graph/serviceprincipals/{servicePrincipalDescriptor}:
    get:
      tags:
      - Service Principals
      description: Get a service principal by its descriptor.
      operationId: Service Principals_Get
      parameters:
      - name: organization
        in: path
        description: The name of the Azure DevOps organization.
        required: true
        schema:
          type: string
      - name: servicePrincipalDescriptor
