components:
  schemas:
    AadGraphMember:
      properties:
        directoryAlias:
          type: string
          description: "The short, generally unique name for the user in the backing\
            \ directory. For AAD users, this corresponds to the mail nickname, which\
            \ is often but not necessarily similar to the part of the user's mail\
            \ address before the @ sign. For GitHub users, this corresponds to the\
            \ GitHub user handle."
        isDeletedInOrigin:
          type: boolean
          description: "When true, the group has been deleted in the identity provider"
        metaType:
          type: string
          description: "The meta type of the user in the origin, such as \"member\"\
            , \"guest\", etc. See UserMetaType for the set of possible values."
      description: ""
      allOf:
      - $ref: '#/components/schemas/GraphMember'
    Avatar:
      type: object
      properties:
        isAutoGenerated:
          type: boolean
        size:
          type: string
          enum:
          - small
          - medium
          - large
          x-ms-enum:
            name: AvatarSize
            values:
            - value: small
              description: ""
            - value: medium
              description: ""
            - value: large
              description: ""
        timeStamp:
          type: string
          format: date-time
        value:
          type: array
          items:
            pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
            type: string
            format: byte
      description: ""
    GraphCachePolicies:
      type: object
      properties:
        cacheSize:
          type: integer
          description: Size of the cache
          format: int32
      description: ""
    GraphDescriptorResult:
      type: object
      properties:
        _links:
          $ref: '#/components/schemas/ReferenceLinks'
        value:
          type: string
      description: Subject descriptor of a Graph entity
    GraphFederatedProviderData:
      type: object
      properties:
        accessToken:
          type: string
          description: "The access token that can be used to communicated with the\
            \ federated provider on behalf on the target identity, if we were able\
            \ to successfully acquire one, otherwise <code>null</code>, if we were\
            \ not."
        providerName:
          type: string
          description: "The name of the federated provider, e.g. \"github.com\"."
        subjectDescriptor:
          type: string
          description: The descriptor of the graph subject to which this federated
            provider data corresponds.
        version:
          type: integer
          description: "The version number of this federated provider data, which\
            \ corresponds to when it was last updated. Can be used to prevent returning\
            \ stale provider data from the cache when the caller is aware of a newer\
            \ version, such as to prevent local cache poisoning from a remote cache\
            \ or store. This is the app layer equivalent of the data layer sequence\
            \ ID."
          format: int64
      description: Represents a set of data used to communicate with a federated provider
        on behalf of a particular user.
    GraphGlobalExtendedPropertyBatch:
      type: object
      properties:
        propertyNameFilters:
          type: array
          items:
            type: string
        subjectDescriptors:
          type: array
          items:
            type: string
      description: ""
    GraphGroup:
      properties:
        description:
          type: string
          description: A short phrase to help human readers disambiguate groups with
            similar names
      description: Graph group entity
      allOf:
      - $ref: '#/components/schemas/GraphMember'
    GraphGroupCreationContext:
      type: object
      properties:
        storageKey:
          type: string
          description: "Optional: If provided, we will use this identifier for the\
            \ storage key of the created group"
          format: uuid
      description: Do not attempt to use this type to create a new group. This type
        does not contain sufficient fields to create a new group.
    GraphGroupMailAddressCreationContext:
      properties:
        mailAddress:
          type: string
          description: "This should be the mail address or the group in the source\
            \ AD or AAD provider. Example: jamal@contoso.com Team Services will communicate\
            \ with the source provider to fill all other fields on creation."
      description: Use this type to create a new group using the mail address as a
        reference to an existing group from an external AD or AAD backed provider.
        This is the subset of GraphGroup fields required for creation of a group for
        the AAD and AD use case.
      allOf:
      - $ref: '#/components/schemas/GraphGroupCreationContext'
    GraphGroupOriginIdCreationContext:
      properties:
        originId:
          type: string
          description: "This should be the object id or sid of the group from the\
            \ source AD or AAD provider. Example: d47d025a-ce2f-4a79-8618-e8862ade30dd\
            \ Team Services will communicate with the source provider to fill all\
            \ other fields on creation."
      description: Use this type to create a new group using the OriginID as a reference
        to an existing group from an external AD or AAD backed provider. This is the
        subset of GraphGroup fields required for creation of a group for the AD and
        AAD use case.
      allOf:
      - $ref: '#/components/schemas/GraphGroupCreationContext'
    GraphGroupVstsCreationContext:
      properties:
        crossProject:
          type: boolean
          description: For internal use only in back compat scenarios.
        description:
          type: string
          description: "Used by VSTS groups; if set this will be the group description,\
            \ otherwise ignored"
        descriptor:
          type: string
        displayName:
          type: string
          description: "Used by VSTS groups; if set this will be the group DisplayName,\
            \ otherwise ignored"
        restrictedVisibility:
          type: boolean
          description: For internal use only in back compat scenarios.
        specialGroupType:
          type: string
          description: For internal use only in back compat scenarios.
      description: Use this type to create a new Vsts group that is not backed by
        an external provider.
      allOf:
      - $ref: '#/components/schemas/GraphGroupCreationContext'
    GraphMember:
      properties:
        domain:
          type: string
          description: "This represents the name of the container of origin for a\
            \ graph member. (For MSA this is \"Windows Live ID\", for AD the name\
            \ of the domain, for AAD the tenantID of the directory, for VSTS groups\
            \ the ScopeId, etc)"
        mailAddress:
