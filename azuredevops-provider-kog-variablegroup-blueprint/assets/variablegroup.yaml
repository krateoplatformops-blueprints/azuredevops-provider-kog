  /plugin/{organization}/{project}/variablegroups:
    post:
      servers:
        - url: {{ include "variablegroup.webServiceUrl" . }}
          description: URL of the Azure DevOps RDC plugin
      tags:
        - VariableGroup
      summary: List variable groups (plugin)
      description: Retrieves all variable groups for a project from Azure DevOps.
      parameters:
        - name: organization
          in: path
          description: Organization name
          required: true
          schema:
            type: string
        - name: project
          in: path
          description: Project name or ID
          required: true
          schema:
            type: string
        - name: api-version
          in: query
          description: API version
          required: true
          schema:
            type: string
      requestBody:
        description: CR spec forwarded by RDC; used to patch the matching item
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/variablegroup.VariableGroupParameters'
        required: true
      responses:
        "200":
          description: List response with normalised items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/variablegroup.VariableGroupListResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
      x-codegen-request-body-name: body
  /plugin/{organization}/{project}/variablegroups/{groupId}:
    post:
      servers:
        - url: {{ include "variablegroup.webServiceUrl" . }}
          description: URL of the Azure DevOps RDC plugin
      tags:
        - VariableGroup
      summary: Get a variable group (plugin)
      description: Retrieves a variable group by ID from Azure DevOps, then patches secret
      parameters:
        - name: organization
          in: path
          description: Organization name
          required: true
          schema:
            type: string
        - name: project
          in: path
          description: Project name or ID
          required: true
          schema:
            type: string
        - name: groupId
          in: path
          description: Variable group ID
          required: true
          schema:
            type: string
        - name: api-version
          in: query
          description: API version
          required: true
          schema:
            type: string
      requestBody:
        description: CR spec forwarded by RDC; used to restore secret variable values
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/variablegroup.VariableGroupParameters'
        required: true
      responses:
        "200":
          description: Variable group with normalised booleans and patched secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/variablegroup.VariableGroup'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
      x-codegen-request-body-name: body
    delete:
      servers:
        - url: {{ include "variablegroup.webServiceUrl" . }}
          description: URL of the Azure DevOps RDC plugin
      tags:
        - VariableGroup
      summary: Delete a variable group (plugin)
      description: Deletes a variable group from Azure DevOps by calling the organisation-level
      parameters:
        - name: organization
          in: path
          description: Organization name
          required: true
          schema:
            type: string
        - name: project
          in: path
          description: Project ID (used as projectIds query param for the ADO delete endpoint)
          required: true
          schema:
            type: string
        - name: groupId
          in: path
          description: Variable group ID
          required: true
          schema:
            type: string
        - name: api-version
          in: query
          description: API version
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content – variable group deleted
          content: {}
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string






components:
  schemas:
    GraphSubjectBase:
      type: object
      properties:
        _links:
          $ref: '#/components/schemas/ReferenceLinks'
        descriptor:
          type: string
          description: The descriptor is the primary way to reference the graph subject while the system is running. This
            field will uniquely identify the same graph subject across both Accounts and Organizations.
        displayName:
          type: string
          description: This is the non-unique display name of the graph subject. To change this field, you must alter its
            value in the source provider.
        url:
          type: string
          description: This url is the full route to the source resource of this graph subject.
      description: ''
    IdentityRef:
      # FIXED, added `type:object` to avoid warning of type mismatch
      type: object
      properties:
        directoryAlias:
          type: string
          description: Deprecated - Can be retrieved by querying the Graph user referenced in the "self" entry of the IdentityRef
            "_links" dictionary
        id:
          type: string
        imageUrl:
          type: string
          description: Deprecated - Available in the "avatar" entry of the IdentityRef "_links" dictionary
        inactive:
          type: boolean
          description: Deprecated - Can be retrieved by querying the Graph membership state referenced in the "membershipState"
            entry of the GraphUser "_links" dictionary
        isAadIdentity:
          type: boolean
          description: Deprecated - Can be inferred from the subject type of the descriptor (Descriptor.IsAadUserType/Descriptor.IsAadGroupType)
        isContainer:
          type: boolean
          description: Deprecated - Can be inferred from the subject type of the descriptor (Descriptor.IsGroupType)
        isDeletedInOrigin:
          type: boolean
        profileUrl:
          type: string
          description: Deprecated - not in use in most preexisting implementations of ToIdentityRef
        uniqueName:
          type: string
          description: Deprecated - use Domain+PrincipalName instead
      description: ''
      allOf:
      - $ref: '#/components/schemas/GraphSubjectBase'
    ProjectReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      description: ''
    ReferenceLinks:
      type: object
      properties:
        links:
          type: object
          additionalProperties:
            type: object
            properties: {}
          description: The readonly view of the links.  Because Reference links are readonly, we only want to expose them
            as read only.
      description: The class to represent a collection of REST reference links.
    VariableGroup:
      type: object
      properties:
        createdBy:
          $ref: '#/components/schemas/IdentityRef'
        createdOn:
          type: string
          description: Gets or sets the time when variable group was created.
          format: date-time
        description:
          type: string
          description: Gets or sets description of the variable group.
        id:
          type: integer
          description: Gets or sets id of the variable group.
          format: int32
        isShared:
          type: boolean
          description: Indicates whether variable group is shared with other projects or not.
        modifiedBy:
          $ref: '#/components/schemas/IdentityRef'
        modifiedOn:
          type: string
          description: Gets or sets the time when variable group was modified
          format: date-time
        name:
          type: string
          description: Gets or sets name of the variable group.
        providerData:
          $ref: '#/components/schemas/VariableGroupProviderData'
        type:
          type: string
          description: Gets or sets type of the variable group.
        variableGroupProjectReferences:
          type: array
          description: all project references where the variable group is shared with other projects.
          items:
            $ref: '#/components/schemas/VariableGroupProjectReference'
        variables:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/VariableValue'
          description: Gets or sets variables contained in the variable group.
      description: A variable group is a collection of related variables.
    VariableGroupParameters:
      type: object
      properties:
        description:
          type: string
          description: Sets description of the variable group.
        name:
          type: string
          description: Sets name of the variable group.
        providerData:
          $ref: '#/components/schemas/VariableGroupProviderData'
        type:
          type: string
          description: Sets type of the variable group.
        variableGroupProjectReferences:
          type: array
          items:
            $ref: '#/components/schemas/VariableGroupProjectReference'
        variables:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/VariableValue'
          description: Sets variables contained in the variable group.
      description: ''
    VariableGroupProjectReference:
      type: object
      properties:
        description:
          type: string
          description: Gets or sets description of the variable group.
        name:
          type: string
          description: Gets or sets name of the variable group.
        projectReference:
          $ref: '#/components/schemas/ProjectReference'
      description: A variable group reference is a shallow reference to variable group.
    VariableGroupProviderData:
      type: object
      description: Defines provider data of the variable group.
    VariableValue:
      type: object
      properties:
        isReadOnly:
          type: boolean
          description: Indicates whether the variable can be changed during script's execution runtime.
        isSecret:
          type: boolean
          description: Indicates whether the variable should be encrypted at rest.
        value:
          type: string
          description: The value of the variable.
      description: A wrapper class for a generic variable.



    variablegroup.IdentityRef:
      type: object
      properties:
        descriptor:
          type: string
        displayName:
          type: string
        id:
          type: string
        uniqueName:
          type: string
        url:
          type: string
    variablegroup.ProjectReference:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    variablegroup.VariableGroup:
      type: object
      properties:
        createdBy:
          $ref: '#/components/schemas/variablegroup.IdentityRef'
        createdOn:
          type: string
        description:
          type: string
        id:
          type: integer
        isShared:
          type: boolean
        modifiedBy:
          $ref: '#/components/schemas/variablegroup.IdentityRef'
        modifiedOn:
          type: string
        name:
          type: string
        providerData:
          type: object
          additionalProperties: true
        type:
          type: string
        variableGroupProjectReferences:
          type: array
          items:
            $ref: '#/components/schemas/variablegroup.VariableGroupProjectReference'
        variables:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/variablegroup.VariableValue'
    variablegroup.VariableGroupListResponse:
      type: object
      properties:
        count:
          type: integer
        value:
          type: array
          items:
            $ref: '#/components/schemas/variablegroup.VariableGroup'
    variablegroup.VariableGroupParameters:
      type: object
      properties:
        description:
          type: string
        name:
          type: string
        providerData:
          type: object
          additionalProperties: true
        type:
          type: string
        variableGroupProjectReferences:
          type: array
          items:
            $ref: '#/components/schemas/variablegroup.VariableGroupProjectReference'
        variables:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/variablegroup.VariableValue'
    variablegroup.VariableGroupProjectReference:
      type: object
      properties:
        description:
          type: string
        name:
          type: string
        projectReference:
          $ref: '#/components/schemas/variablegroup.ProjectReference'
    variablegroup.VariableValue:
      type: object
      properties:
        isReadOnly:
          type: boolean
        isSecret:
          type: boolean
        value:
          type: string


  
