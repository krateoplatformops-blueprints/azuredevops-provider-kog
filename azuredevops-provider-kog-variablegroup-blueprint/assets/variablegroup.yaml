          type: string
      - name: project
        in: path
        description: Project ID or project name
        required: true
        schema:
          type: string
      - name: groupIds
        in: query
        description: Comma separated list of Ids of variable groups.
        # FIXED, removed required as it's not actually required
        #required: true
        schema:
          type: string
          format: array (int32)
      - name: loadSecrets
        in: query
        description: Flag indicating if the secrets within variable groups should be loaded.
        schema:
          type: boolean
      - name: api-version
        in: query
