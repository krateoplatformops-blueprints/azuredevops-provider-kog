components:
  schemas:
    EnvironmentCreateParameter:
      type: object
      properties:
        description:
          type: string
          description: Description of the environment.
        name:
          type: string
          description: Name of the environment.
      description: Properties to create Environment.
    EnvironmentInstance:
      type: object
      properties:
        createdBy:
          $ref: '#/components/schemas/IdentityRef'
        createdOn:
          type: string
          description: Creation time of the Environment
          format: date-time
        description:
          type: string
          description: Description of the Environment.
        id:
          type: integer
          description: Id of the Environment
          format: int32
        lastModifiedBy:
          $ref: '#/components/schemas/IdentityRef'
        lastModifiedOn:
          type: string
          description: Last modified time of the Environment
          format: date-time
        name:
          type: string
          description: Name of the Environment.
        project:
          $ref: '#/components/schemas/ProjectReference'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentResourceReference'
      description: Environment.
    EnvironmentResourceReference:
      type: object
      properties:
        id:
          type: integer
          description: Id of the resource.
          format: int32
        name:
          type: string
          description: Name of the resource.
        tags:
          type: array
          description: Tags of the Environment Resource Reference.
          items:
            type: string
        type:
          type: string
          description: Type of the resource.
          enum:
          - undefined
          - generic
          - virtualMachine
          - kubernetes
          x-ms-enum:
            name: EnvironmentResourceType
            values:
            - value: undefined
              description: ''
            - value: generic
              description: Unknown resource type
            - value: virtualMachine
              description: Virtual machine resource type
            - value: kubernetes
              description: Kubernetes resource type
      description: EnvironmentResourceReference.
    EnvironmentUpdateParameter:
      type: object
      properties:
        description:
          type: string
          description: Description of the environment.
        name:
          type: string
          description: Name of the environment.
      description: Properties to update Environment.
    GraphSubjectBase:
      type: object
      properties:
        _links:
          $ref: '#/components/schemas/ReferenceLinks'
        descriptor:
          type: string
        displayName:
          type: string
        url:
          type: string
      description: ''
    IdentityRef:
      properties:
        directoryAlias:
          type: string
        id:
          type: string
        imageUrl:
          type: string
        inactive:
          type: boolean
        isAadIdentity:
          type: boolean
        isContainer:
          type: boolean
        isDeletedInOrigin:
          type: boolean
        profileUrl:
          type: string
        uniqueName:
          type: string
      description: ''
      allOf:
      - $ref: '#/components/schemas/GraphSubjectBase'
    ProjectReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      description: ''
    ReferenceLinks:
      type: object
      properties:
        links:
          type: object
          additionalProperties:
            type: object
            properties: {}
      description: ''
