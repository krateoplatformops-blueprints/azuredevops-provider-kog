    repositorypermission.RepositoryPermissionRequest:
      type: object
      properties:
        permissions:
          $ref: '#/components/schemas/repositorypermission.PermissionsInfo'
    repositorypermission.RepositoryPermissionResponse:
      type: object
      properties:
        organization:
          type: string
        permissions:
          $ref: '#/components/schemas/repositorypermission.PermissionsInfo'
        projectId:
