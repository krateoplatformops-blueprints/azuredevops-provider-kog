      description: Get a specific team.
      operationId: Teams_Get
      parameters:
      - name: organization
        in: path
        description: The name of the Azure DevOps organization.
        required: true
        schema:
          type: string
      - name: projectId
        in: path
        description: The name or ID (GUID) of the team project containing the team.
        required: true
        schema:
          type: string
      - name: teamId
        in: path
        description: The name or ID (GUID) of the team.
        required: true
        schema:
          type: string
      - name: $expandIdentity
        in: query
        description: A value indicating whether or not to expand Identity information in the result WebApiTeam object.
        schema:
          type: boolean
      - name: api-version
        in: query
        description: Version of the API to use.  This should be set to '7.2-preview.3' to use this version of the api.
        required: true
