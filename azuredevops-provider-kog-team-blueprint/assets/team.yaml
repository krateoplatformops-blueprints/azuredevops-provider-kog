components:
  schemas:
    Identity:
      description: ''
      allOf:
      - $ref: '#/components/schemas/IdentityBase'
    IdentityBase:
      type: object
      properties:
        customDisplayName:
          type: string
          description: The custom display name for the identity (if any). Setting this property to an empty string will clear
            the existing custom display name. Setting this property to null will not affect the existing persisted value (since
            null values do not get sent over the wire or to the database)
        descriptor:
          $ref: '#/components/schemas/IdentityDescriptor'
        id:
          type: string
          description: Identity Identifier. Also called Storage Key, or VSID
          format: uuid
        isActive:
          type: boolean
          description: True if the identity has a membership in any Azure Devops group in the organization.
        isContainer:
          type: boolean
          description: True if the identity is a group.
        masterId:
          type: string
          format: uuid
        memberIds:
          type: array
          description: Id of the members of the identity (groups only).
          items:
            type: string
            format: uuid
        memberOf:
          type: array
          items:
            $ref: '#/components/schemas/IdentityDescriptor'
        members:
          type: array
          items:
            $ref: '#/components/schemas/IdentityDescriptor'
        metaTypeId:
          type: integer
          format: int32
        properties:
          $ref: '#/components/schemas/PropertiesCollection'
        providerDisplayName:
          type: string
          description: The display name for the identity as specified by the source identity provider.
        resourceVersion:
          type: integer
          format: int32
        socialDescriptor:
          type: string
        subjectDescriptor:
          type: string
          description: Subject descriptor of a Graph entity.
        uniqueUserId:
          type: integer
          format: int32
      description: Base Identity class to allow "trimmed" identity class in the GetConnectionData API Makes sure that on-the-wire
        representations of the derived classes are compatible with each other (e.g. Server responds with PublicIdentity object
        while client deserializes it as Identity object) Derived classes should not have additional [DataMember] properties
    IdentityDescriptor:
      type: object
      properties:
        identifier:
          type: string
          description: The unique identifier for this identity, not exceeding 256 chars, which will be persisted.
        identityType:
          type: string
          description: Type of descriptor (for example, Windows, Passport, etc.).
      description: An Identity descriptor is a wrapper for the identity type (Windows SID, Passport) along with a unique identifier
        such as the SID or PUID.
    PropertiesCollection:
      type: object
      properties:
        count:
          type: integer
          description: The count of properties in the collection.
          format: int32
        item:
          type: object
          properties: {}
        keys:
          type: array
          description: The set of keys in the collection.
          items:
            type: string
        values:
          type: array
          description: The set of values in the collection.
          items:
            type: string
      description: The class represents a property bag as a collection of key-value pairs. Values of all primitive types (any
        type with a `TypeCode != TypeCode.Object`) except for `DBNull` are accepted. Values of type Byte[], Int32, Double,
        DateType and String preserve their type, other primitives are retuned as a String. Byte[] expected as base64 encoded
        string.
    WebApiTeam:
      properties:
        description:
          type: string
          description: Team description
        identity:
          $ref: '#/components/schemas/Identity'
        identityUrl:
          type: string
          description: Identity REST API Url to this team
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
      description: ''
      allOf:
      - $ref: '#/components/schemas/WebApiTeamRef'
    WebApiTeamRef:
      type: object
      properties:
        id:
          type: string
          description: Team (Identity) Guid. A Team Foundation ID.
          format: uuid
        name:
          type: string
          description: Team name
        url:
          type: string
          description: Team REST API Url
      description: ''
