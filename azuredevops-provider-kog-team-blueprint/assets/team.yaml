    post:
      tags:
      - Teams
      description: 'Create a team in a team project.


        Possible failure scenarios

        Invalid project name/ID (project doesn''t exist) 404

        Invalid team name or description 400

        Team already exists 400

        Insufficient privileges 400'
      operationId: Teams_Create
      parameters:
      - name: organization
        in: path
        description: The name of the Azure DevOps organization.
        required: true
        schema:
          type: string
      - name: projectId
        in: path
        description: The name or ID (GUID) of the team project in which to create the team.
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: Version of the API to use.  This should be set to '7.2-preview.3' to use this version of the api.
        required: true
        schema:
          type: string
      requestBody:
        description: The team data used to create the team.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebApiTeam'
        required: true
      responses:
        #'200':
        '201': # FIXED
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebApiTeam'
