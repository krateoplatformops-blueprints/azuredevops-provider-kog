components:
  schemas:
    GraphSubjectBase:
      type: object
      properties:
        _links:
          $ref: '#/components/schemas/ReferenceLinks'
        descriptor:
          type: string
          description: The descriptor is the primary way to reference the graph subject while the system is running. This
            field will uniquely identify the same graph subject across both Accounts and Organizations.
        displayName:
          type: string
          description: This is the non-unique display name of the graph subject. To change this field, you must alter its
            value in the source provider.
        url:
          type: string
          description: This url is the full route to the source resource of this graph subject.
      description: ''
    IdentityRef:
      properties:
        directoryAlias:
          type: string
          description: Deprecated - Can be retrieved by querying the Graph user referenced in the "self" entry of the IdentityRef
            "_links" dictionary
        id:
          type: string
        imageUrl:
          type: string
          description: Deprecated - Available in the "avatar" entry of the IdentityRef "_links" dictionary
        inactive:
          type: boolean
          description: Deprecated - Can be retrieved by querying the Graph membership state referenced in the "membershipState"
            entry of the GraphUser "_links" dictionary
        isAadIdentity:
          type: boolean
          description: Deprecated - Can be inferred from the subject type of the descriptor (Descriptor.IsAadUserType/Descriptor.IsAadGroupType)
        isContainer:
          type: boolean
          description: Deprecated - Can be inferred from the subject type of the descriptor (Descriptor.IsGroupType)
        isDeletedInOrigin:
          type: boolean
        profileUrl:
          type: string
          description: Deprecated - not in use in most preexisting implementations of ToIdentityRef
        uniqueName:
          type: string
          description: Deprecated - use Domain+PrincipalName instead
      description: ''
      allOf:
      - $ref: '#/components/schemas/GraphSubjectBase'
    ProjectReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      description: ''
    ReferenceLinks:
      type: object
      properties:
        links:
          type: object
          additionalProperties:
            type: object
            properties: {}
          description: The readonly view of the links.  Because Reference links are readonly, we only want to expose them
            as read only.
      description: The class to represent a collection of REST reference links.
    VariableGroup:
      type: object
      properties:
        createdBy:
          $ref: '#/components/schemas/IdentityRef'
        createdOn:
          type: string
          description: Gets or sets the time when variable group was created.
          format: date-time
        description:
          type: string
          description: Gets or sets description of the variable group.
        id:
          type: integer
          description: Gets or sets id of the variable group.
          format: int32
        isShared:
          type: boolean
          description: Indicates whether variable group is shared with other projects or not.
        modifiedBy:
          $ref: '#/components/schemas/IdentityRef'
        modifiedOn:
          type: string
          description: Gets or sets the time when variable group was modified
          format: date-time
        name:
          type: string
          description: Gets or sets name of the variable group.
        providerData:
          $ref: '#/components/schemas/VariableGroupProviderData'
        type:
          type: string
          description: Gets or sets type of the variable group.
        variableGroupProjectReferences:
          type: array
          description: all project references where the variable group is shared with other projects.
          items:
            $ref: '#/components/schemas/VariableGroupProjectReference'
        variables:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/VariableValue'
          description: Gets or sets variables contained in the variable group.
      description: A variable group is a collection of related variables.
    VariableGroupParameters:
      type: object
      properties:
        description:
          type: string
          description: Sets description of the variable group.
        name:
          type: string
          description: Sets name of the variable group.
        providerData:
          $ref: '#/components/schemas/VariableGroupProviderData'
        type:
          type: string
          description: Sets type of the variable group.
        variableGroupProjectReferences:
          type: array
          items:
            $ref: '#/components/schemas/VariableGroupProjectReference'
        variables:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/VariableValue'
          description: Sets variables contained in the variable group.
      description: ''
    VariableGroupProjectReference:
      type: object
      properties:
        description:
          type: string
          description: Gets or sets description of the variable group.
        name:
          type: string
          description: Gets or sets name of the variable group.
        projectReference:
          $ref: '#/components/schemas/ProjectReference'
      description: A variable group reference is a shallow reference to variable group.
    VariableGroupProviderData:
      type: object
      description: Defines provider data of the variable group.
    VariableValue:
      type: object
      properties:
        isReadOnly:
          type: boolean
          description: Indicates whether the variable can be changed during script's execution runtime.
        isSecret:
          type: boolean
          description: Indicates whether the variable should be encrypted at rest.
        value:
          type: string
          description: The value of the variable.
      description: A wrapper class for a generic variable.
  parameters:
    api-Version-preview.1:
      name: api-version
      in: query
